#  overthinkos/bootc — the bootc bootable-container image family, split out of the
#  main overthink repo (2026-05). Mounted as a git submodule at image/bootc.
#
#  SINGLE-FILE config (2026-05 import-namespace cutover): every local entity
#  (the bootc images + their bootc VM entities) is inlined here. This repo
#  VENDORS NOTHING — every layer is an `@github.com/...` ref, and the shared
#  build-config + the main repo's base entities arrive via `import:`.
#
#  import: has two shapes —
#    * flat string  → build.yml (shared distro/builder/init vocabulary), merged
#      into this repo's root namespace.
#    * `ov: <ref>`  → the main overthink repo mounted under the `ov` namespace.
#      bootc images root on EXTERNAL upstream bases (no in-repo base to
#      namespace), so the ONLY cross-repo entity ref is the builder: bootc
#      images fall through to `defaults.builder` which maps to ov.fedora-builder
#      (main's fedora-builder, from main's base.yml, via the `ov` namespace).
#      There is no main → bootc coupling (main remote-includes nothing here).
#
#  The debian/ubuntu pattern (NOT fedora's): every bootc image roots on an
#  EXTERNAL upstream base URL (quay.io/fedora/fedora-bootc:43 and
#  ghcr.io/ublue-os/…), so there is NO in-repo bootc base image to keep, and
#  nothing in main consumes any image here.
#
#  Layer tag pins — two pins, each with a distinct reason:
#    * v2026.141.1600 — the ecosystem layer tag. Every layer ref EXCEPT
#      os-system-files/ujust, plus the build.yml file include and the `ov`
#      namespace import is bound to the schema-version tag below.
#    * v2026.142.0552 — the tag carrying the renamed os-system-files/ujust
#      layers (/usr/share/bazzite/), after bazzite-ai → bazzite. Bazzite-
#      exclusive refs → appear once each → no conflict with the other tags.
#
#  Directly buildable: `ov image build selkies-desktop-bootc --include-disabled`
#  (the build verb defaults to this overthink.yml; all images ship enabled:false).
#  From the parent repo: `ov -C image/bootc image build selkies-desktop-bootc
#  --include-disabled`, or anywhere: `ov --repo overthinkos/bootc image build
#  selkies-desktop-bootc --include-disabled`.
version: 2026.143.844
defaults:
    platform:
        - linux/amd64
    tag: auto
    registry: ghcr.io/overthinkos
    build:
        - rpm
    merge:
        auto: false
        max_mb: 128
    # bootc images root on external bases (no builder map to inherit), so they
    # fall through to defaults.builder. fedora-builder lives in main's base.yml,
    # reached under the `ov` namespace via the import below.
    builder:
        cargo: ov.fedora-builder
        npm: ov.fedora-builder
        pixi: ov.fedora-builder
import:
    # Shared build-config vocabulary (distro.fedora + the rpm format template) —
    # flat root import. No layer refs inside, so it pins to the ecosystem tag.
    - '@github.com/overthinkos/overthink/build.yml:v2026.141.1600'
    # Main repo entities under the `ov` namespace — brings ov.fedora-builder
    # (from main's base.yml) into scope for the pixi/npm builds (selkies-desktop,
    # openclaw). bootc images fall through to defaults.builder → ov.fedora-builder.
    - ov: '@github.com/overthinkos/overthink:v2026.143.844'
image:
    aurora:
        enabled: false
        base: ghcr.io/ublue-os/aurora-dx-nvidia-open:stable-daily-43.20260305
        platform:
            - linux/amd64
        distro:
            - fedora:43
            - fedora
        layer:
            - '@github.com/overthinkos/overthink/layers/agent-forwarding:v2026.141.1600'
            - '@github.com/overthinkos/overthink/layers/bootc-base:v2026.141.1600'
            - '@github.com/overthinkos/overthink/layers/sshd:v2026.141.1600'
            - '@github.com/overthinkos/overthink/layers/ov-full:v2026.141.1600'
            - '@github.com/overthinkos/overthink/layers/golang:v2026.141.1600'
    bazzite:
        enabled: false
        base: ghcr.io/ublue-os/bazzite-nvidia-open:stable-43.20260120.1
        platform:
            - linux/amd64
        distro:
            - fedora:43
            - fedora
        layer:
            - '@github.com/overthinkos/overthink/layers/agent-forwarding:v2026.141.1600'
            - '@github.com/overthinkos/overthink/layers/bootc-base:v2026.141.1600'
            - '@github.com/overthinkos/overthink/layers/build-toolchain:v2026.141.1600'
            - '@github.com/overthinkos/overthink/layers/language-runtimes:v2026.141.1600'
            - '@github.com/overthinkos/overthink/layers/ujust:v2026.142.0552'
            - '@github.com/overthinkos/overthink/layers/dev-tools:v2026.141.1600'
            - '@github.com/overthinkos/overthink/layers/github-actions:v2026.141.1600'
            - '@github.com/overthinkos/overthink/layers/virtualization:v2026.141.1600'
            - '@github.com/overthinkos/overthink/layers/kubernetes:v2026.141.1600'
            - '@github.com/overthinkos/overthink/layers/docker-ce:v2026.141.1600'
            - '@github.com/overthinkos/overthink/layers/google-cloud:v2026.141.1600'
            - '@github.com/overthinkos/overthink/layers/vr-streaming:v2026.141.1600'
            - '@github.com/overthinkos/overthink/layers/cuda:v2026.141.1600'
            - '@github.com/overthinkos/overthink/layers/devops-tools:v2026.141.1600'
            - '@github.com/overthinkos/overthink/layers/grafana-tools:v2026.141.1600'
            - '@github.com/overthinkos/overthink/layers/desktop-apps:v2026.141.1600'
            - '@github.com/overthinkos/overthink/layers/vscode:v2026.141.1600'
            - '@github.com/overthinkos/overthink/layers/typst:v2026.141.1600'
            - '@github.com/overthinkos/overthink/layers/copr-desktop:v2026.141.1600'
            - '@github.com/overthinkos/overthink/layers/os-config:v2026.141.1600'
            - '@github.com/overthinkos/overthink/layers/os-system-files:v2026.142.0552'
    selkies-desktop-bootc:
        enabled: false
        base: quay.io/fedora/fedora-bootc:43
        platform:
            - linux/amd64
        distro:
            - fedora:43
            - fedora
        layer:
            - '@github.com/overthinkos/overthink/layers/agent-forwarding:v2026.141.1600'
            - '@github.com/overthinkos/overthink/layers/bootc-base:v2026.141.1600'
            - '@github.com/overthinkos/overthink/layers/rpmfusion:v2026.141.1600'
            - '@github.com/overthinkos/overthink/layers/selkies-desktop:v2026.141.1600'
            - '@github.com/overthinkos/overthink/layers/tailscale:v2026.141.1600'
            - '@github.com/overthinkos/overthink/layers/keepassxc:v2026.141.1600'
            - '@github.com/overthinkos/overthink/layers/dbus:v2026.141.1600'
            - '@github.com/overthinkos/overthink/layers/ov:v2026.141.1600'
        port:
            - 13000:3000
            - 19222:9222
            - 19224:9224
        eval:
            - command: test -x /usr/bin/labwc && test -x /usr/bin/google-chrome-stable && test -x /usr/bin/tailscale && test -x /usr/bin/keepassxc
              id: selkies-desktop-bootc-binaries
              exit_status: 0
vm:
    aurora-bootc:
        source:
            kind: bootc
            image: aurora
        disk_size: 80 GiB
        ram: 12G
        cpu: 4
    bazzite-bootc:
        source:
            kind: bootc
            image: bazzite
    selkies-desktop-bootc-bootc:
        source:
            kind: bootc
            image: selkies-desktop-bootc
        disk_size: 40 GiB
        ram: 8G
        cpu: 4
        ssh:
            user: root
            port: 2250
