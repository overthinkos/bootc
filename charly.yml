#  overthinkos/bootc — the bootc bootable-container image family, split out of the
#  main opencharly repo (2026-05). Mounted as a git submodule at image/bootc.
#
#  SINGLE-FILE config (2026-05 import-namespace cutover): every local entity
#  (the bootc images + their bootc VM entities) is inlined here. This repo
#  VENDORS its bootc-exclusive layers locally under candy/ (resolved via the
#  discover: block); every shared layer is an `@github.com/...` ref, and the
#  shared build-config + the main repo's base entities arrive via `import:`.
#
#  import: has two shapes —
#    * flat string  → build.yml (shared distro/builder/init vocabulary), merged
#      into this repo's root namespace.
#    * `charly: <ref>`  → the main opencharly repo mounted under the `charly` namespace.
#      bootc images root on EXTERNAL upstream bases (no in-repo base to
#      namespace), so the ONLY cross-repo entity ref is the builder: bootc
#      images fall through to `defaults.builder` which maps to charly.fedora-builder
#      (main's fedora-builder, from main's base.yml, via the `charly` namespace).
#      There is no main → bootc coupling (main remote-includes nothing here).
#
#  The debian/ubuntu pattern (NOT fedora's): every bootc image roots on an
#  EXTERNAL upstream base URL (quay.io/fedora/fedora-bootc:43 and
#  ghcr.io/ublue-os/…), so there is NO in-repo bootc base image to keep, and
#  nothing in main consumes any image here.
#
#  Layer tag pins — shared layers are pulled from main at the ecosystem tag
#  v2026.141.1600 (the build.yml file include and the `charly` namespace import use
#  it too). The bootc-exclusive layers (including os-system-files/ujust, which
#  ship /usr/share/bazzite/ content) are now vendored locally and carry no tag.
#
#  Directly buildable: `charly box build bazzite` (the build verb defaults to
#  this charly.yml). From the parent repo: `charly -C image/bootc image build
#  bazzite`, or anywhere: `charly --repo overthinkos/bootc image build bazzite`.
version: 2026.160.1301
defaults:
    platform:
        - linux/amd64
    tag: auto
    registry: ghcr.io/overthinkos
    build:
        - rpm
    merge:
        auto: false
        max_mb: 128
    # bootc images root on external bases (no builder map to inherit), so they
    # fall through to defaults.builder. fedora-builder lives in main's base.yml,
    # reached under the `charly` namespace via the import below.
    builder:
        cargo: charly.fedora-builder
        npm: charly.fedora-builder
        pixi: charly.fedora-builder
import:
    # Main repo entities under the `charly` namespace — brings charly.fedora-builder
    # (from main's base.yml) into scope for the pixi/npm builds (selkies-desktop,
    # openclaw). bootc images fall through to defaults.builder → charly.fedora-builder.
    - charly: '@github.com/overthinkos/overthink:v2026.160.2017'
discover:
    - path: box
      recursive: true
    - path: candy
      recursive: true
vm:
    aurora-bootc:
        source:
            kind: bootc
            box: aurora
        disk_size: 80 GiB
        ram: 12G
        cpu: 4
    bazzite-bootc:
        source:
            kind: bootc
            box: bazzite
